# West WX Watchers — BoM warnings relay. Runs every 5 minutes (GitHub may run it a few minutes late when busy).
name: BoM warnings relay
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}          # lets you run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install shapely==2.0.6
      - run: python relay.py
      - name: Save changes (only if the warnings changed)
        run: |
          git config user.name "wwxw-relay"
          git config user.email "relay@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "No change"; else git commit -m "Warnings update $(date -u +%H:%MZ)" && git push; fi
