name: Android release (Play Store)
# Run by hand (Actions tab > Android release > Run workflow). Builds the signed release bundle (.aab) to upload to
# Google Play, signed with the private upload key in the UPLOAD_KEYSTORE_B64 and UPLOAD_KEY_PASS secrets.
# With the PLAY_SERVICE_ACCOUNT_JSON secret set it also sends the bundle straight to Google Play (the track picked below);
# without it, download the .aab from the run's artifacts and upload it in the Play Console by hand.
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track (alpha = closed testing, beta = open testing)'
        type: choice
        options: [alpha, internal, beta, production]
        default: alpha
      notes:
        description: "What's new (shown on the Play Store)"
        default: 'Improvements and fixes.'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Firebase set-up
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ] && [ -f google-services.json ]; then GSJ=$(cat google-services.json); fi
          echo "GSJ_FILE=$([ -n "$GSJ" ] && echo yes || echo no)" >> $GITHUB_ENV
          if [ -n "$GSJ" ]; then echo "window.PUSH_READY = true;" > www/build.js; echo "Firebase: yes"; else echo "window.PUSH_READY = false;" > www/build.js; echo "Firebase: not set (alerts can't be turned on in this build)"; fi
      - name: Android project
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npx cap add android
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/; s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/; s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/' android/variables.gradle && grep -n 'SdkVersion' android/variables.gradle   # Android 7.0+, targets Android 16 (API 36): Google Play's requirements
          echo 'android.suppressUnsupportedCompileSdk=36' >> android/gradle.properties
          RES=android/app/src/main/res
          cp -r res/mipmap-* res/drawable-* $RES/
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#EEF4F5</color>\n    <color name="wwxw_accent">#0E7C86</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <application#' $M
          sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_wwxw" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/wwxw_accent" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="alerts" />\n    </application>#' $M
          G=android/app/build.gradle
          sed -i "s/versionCode 1/versionCode $((1000 + GITHUB_RUN_NUMBER))/; s/versionName \"1.0\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" $G
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json; elif [ -f google-services.json ]; then cp google-services.json android/app/; fi
          npx cap sync android
          grep -n "permission\|meta-data" $M
      - name: Build and sign the release bundle
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KP: ${{ secrets.UPLOAD_KEY_PASS }}
        run: |
          [ -n "$KS" ] && [ -n "$KP" ] || { echo "::error::Add the UPLOAD_KEYSTORE_B64 and UPLOAD_KEY_PASS secrets first"; exit 1; }
          printf '%s' "$KS" | base64 -d > /tmp/upload.jks
          cd android && ./gradlew bundleRelease --no-daemon -q
          A=app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore /tmp/upload.jks -storepass "$KP" -keypass "$KP" -sigalg SHA256withRSA -digestalg SHA-256 "$A" upload
          jarsigner -verify "$A" | tail -1
          mkdir -p /tmp/out && cp "$A" "/tmp/out/wwxw-$(date -u +%Y%m%d)-v$((1000 + GITHUB_RUN_NUMBER)).aab"; rm -f /tmp/upload.jks
          grep -o 'versionCode [0-9]*\|versionName "[^"]*"' app/build.gradle
      - uses: actions/upload-artifact@v4
        with:
          name: wwxw-play-release
          path: /tmp/out/*.aab
          retention-days: 30
      - name: Send to Google Play
        env:
          PSA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PSA" ]; then echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret: upload the .aab in the Play Console by hand"; echo "PLAY_UP=no" >> $GITHUB_ENV; exit 0; fi
          mkdir -p /tmp/whatsnew && printf '%s' "${{ inputs.notes }}" | head -c 500 > /tmp/whatsnew/whatsnew-en-AU
          echo "PLAY_UP=yes" >> $GITHUB_ENV
      - if: env.PLAY_UP == 'yes'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.westweatherwatchers.app
          releaseFiles: /tmp/out/*.aab
          track: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: /tmp/whatsnew
