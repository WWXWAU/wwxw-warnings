name: 1-degree model grid

# ECMWF HRES + AIFS (ECMWF open data), GFS + GEFS (NOAA) and the ECMWF ensemble mean (Open-Meteo), 1-degree grid over
# WA, 7 days, 4 times a day. The slow ECMWF downloads run side by side in their own jobs (AIFS, HRES), so one busy
# server can't hold up the rest. A model whose download falls short stands in with its previous run (up to 36 h old).
# The result goes to the grid1-data branch (replaced each time, so the repository doesn't grow), where the outlook
# reads it - but only with at least 4 of the 5 models; otherwise the last published grid stays.
# Checked every hour: it only downloads and rebuilds when a model has a newer run out than the published one
# (or the published grid is more than 7 hours old), so a new run is on the page within about an hour of coming out.
on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grid1
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      go: ${{ steps.cmp.outputs.go }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q numpy
      - name: Newer runs out?
        id: cmp
        run: |
          git fetch -q --depth 1 origin grid1-data && git show FETCH_HEAD:status.json > published.json || echo '{}' > published.json
          python grid1/fetch_models.py --newest > newest.log; grep -v '^{' newest.log || true; tail -1 newest.log > newest.json
          python3 - <<'EOF'
          import json, os, datetime as dt
          pub, new = json.load(open('published.json')), json.load(open('newest.json'))
          runs = pub.get('runs', {}); newer = [m for m, r in new.items() if r and (runs.get(m) or '') < r]
          made = pub.get('made'); age = (dt.datetime.utcnow() - dt.datetime.strptime(made, '%Y-%m-%dT%H:%MZ')).total_seconds() / 3600 if made else 99
          go = bool(newer) or age > 7 or os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' or bool(pub.get('standin')) or bool(pub.get('missing'))
          print('Published:', runs, '| newest out:', new, '| newer:', newer or 'none', '| grid %.1f h old' % age, '->', 'update' if go else 'nothing to do')
          open(os.environ['GITHUB_OUTPUT'], 'a').write('go=%s\n' % ('true' if go else 'false'))
          EOF

  fetch:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        part: [NOAA, AIFS, ECMWF]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install numpy eccodes
          python -c "import eccodes" || (sudo apt-get update && sudo apt-get install -y libeccodes-dev && pip install --force-reinstall eccodes)
      - name: The last published runs (stand-ins)
        run: |
          mkdir -p prev
          if git fetch -q --depth 1 origin grid1-data; then
            for f in $(git ls-tree --name-only FETCH_HEAD | grep '^raw_.*\.json\.gz$'); do git show "FETCH_HEAD:$f" > "prev/$f"; done
          fi
          ls -la prev
      - name: Download
        env:
          JOB_BUDGET_MIN: '100'
        run: |
          case "${{ matrix.part }}" in
            NOAA) python grid1/fetch_models.py GFS GEFS ECENS ;;
            *)    python grid1/fetch_models.py ${{ matrix.part }} ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-${{ matrix.part }}
          path: |
            data/grid1/raw_*.json
            data/grid1/cape_check.json
          if-no-files-found: ignore
          retention-days: 2

  build:
    needs: [check, fetch]
    if: always() && needs.check.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: data/grid1
          merge-multiple: true
      - name: Enough models?
        id: check
        run: |
          python3 - <<'EOF'
          import glob, json, os, datetime as dt
          runs, stand = {}, []
          for f in sorted(glob.glob('data/grid1/raw_*.json')):
              d = json.load(open(f))
              if d.get('rows'):
                  runs[d['model']] = d['run']
                  if d.get('fallback'): stand.append(d['model'])
          ok = len(runs) >= 4
          status = {'made': dt.datetime.utcnow().strftime('%Y-%m-%dT%H:%MZ'), 'runs': runs, 'standin': stand,
                    'missing': [m for m in ['GFS', 'GEFS', 'ECENS', 'AIFS', 'ECMWF'] if m not in runs]}
          json.dump(status, open('status.json', 'w'))
          print(json.dumps(status))
          print('Publishing.' if ok else 'Only %d models: not publishing (the last grid stays).' % len(runs))
          open(os.environ['GITHUB_OUTPUT'], 'a').write('ok=%s\n' % ('true' if ok else 'false'))
          EOF
      - name: Work out the indices
        if: steps.check.outputs.ok == 'true'
        run: node grid1/indices.js data/grid1
      - name: Publish to the grid1-data branch
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir -p /tmp/pub && cp data/grid1/outlook_1deg.json.gz status.json /tmp/pub/
          cp data/grid1/cape_check.json /tmp/pub/ 2>/dev/null || true   # derived AIFS CAPE (fetch_models.py)
          for f in data/grid1/raw_*.json; do gzip -c "$f" > "/tmp/pub/$(basename "$f").gz"; done   # stand-ins for next time
          ls -la /tmp/pub
          cd /tmp/pub
          git init -q -b grid1-data
          git config user.name "wwxw-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "1-degree model grid"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" grid1-data
      - name: Not published
        if: steps.check.outputs.ok != 'true'
        run: |
          echo "::warning::Fewer than 4 models came through: the grid wasn't published (the outlook keeps the last one)."
          exit 1
