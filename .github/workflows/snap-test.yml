name: Snap test
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tools/snap_test.js
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: 'shot-*.png' }
