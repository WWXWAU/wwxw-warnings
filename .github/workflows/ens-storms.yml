name: ECMWF ensemble chance of storms

# ECMWF publishes the 00z ensemble about 8-9am UTC and the 12z about 8-9pm UTC.
# Runs a few times around then; the script skips a run it has already done.
on:
  schedule:
    - cron: '25 8 * * *'
    - cron: '25 9 * * *'
    - cron: '25 20 * * *'
    - cron: '25 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ens-storms
  cancel-in-progress: false

jobs:
  ens:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install numpy eccodes
          python -c "import eccodes" || (sudo apt-get update && sudo apt-get install -y libeccodes-dev && pip install --force-reinstall eccodes)
      - name: Work out the chance of storms
        run: |
          SCRIPT=$(git ls-files | grep -m1 'ens_storms.py$' || true)
          if [ -z "$SCRIPT" ]; then echo "::error::ens_storms.py is not in the repo - upload it to the top level"; exit 1; fi
          echo "Using $SCRIPT"
          python "$SCRIPT"
      - name: Save
        run: |
          git config user.name "wwxw-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ens_storms.json
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "ECMWF ensemble chance of storms"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i*5)); done
          exit 1
