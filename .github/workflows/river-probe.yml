name: River probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/river_probe.py
        env:
          ORION_API_KEY: ${{ secrets.ORION_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: review
          path: review/
          retention-days: 2
