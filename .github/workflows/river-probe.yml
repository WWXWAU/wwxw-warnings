name: River probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/river_probe.py
        env:
          ORION_API_KEY: ${{ secrets.ORION_API_KEY }}
      - name: Hand over the encrypted list (deleted once read)
        run: |
          if [ -d review ]; then cd review && git init -q -b review && git add -A && git -c user.name=wwxw-bot -c user.email=actions@users.noreply.github.com commit -qm "encrypted review list" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" review; fi
