name: Warning image previews
on: workflow_dispatch
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow
      - run: python warnimg.py data/test/sample-warning.json previews --styles
      - uses: actions/upload-artifact@v4
        with:
          name: warning-previews
          path: previews/
