name: Warning image previews
on:
  workflow_dispatch:
    inputs:
      file: { required: false, default: 'data/test/sample-warning.json' }
      sat_at: { required: false, default: '' }
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow numpy h5py
      - run: python warnimg.py "${{ inputs.file || 'data/test/sample-warning.json' }}" previews
        env:
          WARN_SAT_AT: ${{ inputs.sat_at }}
      - name: Save to the previews branch
        run: |
          cd previews
          git init -q -b previews && git add -A
          git -c user.name=wwxw-bot -c user.email=actions@users.noreply.github.com commit -qm "Warning image previews"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews
