name: River levels
# WA river levels from DWER's telemetered gauges, every 15 minutes, for the River Levels page.
# GitHub only starts scheduled runs about once an hour, so each run keeps going for most of the hour and
# refreshes every 15 minutes itself. Published to its own branch:
# https://raw.githubusercontent.com/WWXWAU/wwxw-warnings/river-data/rivers.json
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      once:
        description: 'Run once only (no 15-minute loop)'
        default: 'false'
permissions:
  contents: write
concurrency:
  group: rivers
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every 15 minutes, for most of the hour
        env:
          ONCE: ${{ inputs.once }}
          ORION_API_KEY: ${{ secrets.ORION_API_KEY }}
        run: |
          FILES="rivers-roads.json rivers-history.json rivers-sites.json rivers-flood.json rivers-upstream.json rivers-daily.json rivers-lines.json rivers-basins.json orion-cache.json orion-obs.json"
          start=$(date +%s)
          for cycle in 1 2 3 4; do
            t0=$(date +%s)
            rm -rf out pub && mkdir -p out
            if git fetch -q --depth 1 origin river-data 2>/dev/null; then
              for f in $FILES; do git show FETCH_HEAD:$f > out/$f 2>/dev/null || rm -f out/$f; done
            fi
            if python rivers/rivers.py out; then
              mkdir -p pub && ( cd pub && git init -q -b river-data && cp ../out/rivers.json $(for f in $FILES; do echo ../out/$f; done) . && git add -A \
                && git -c user.name=wwxw-bot -c user.email=actions@users.noreply.github.com commit -qm "River levels" \
                && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" river-data ) || echo "Publish failed (cycle $cycle)"
            else
              echo "River levels run failed (cycle $cycle)"
            fi
            [ "$ONCE" = "true" ] && break
            next=$(( t0 + 900 ))
            # stop before the next hour's run is due to start
            [ $(( next - start )) -gt 3000 ] && break
            now=$(date +%s); [ $next -gt $now ] && sleep $(( next - now ))
          done
