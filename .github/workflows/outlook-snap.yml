name: Outlook fast copy
# Every 30 minutes: fetch the outlook page's LOCKED (encrypted) copy from the outlook script (?page=snapjson) and save it
# to the 'pages-outlook' branch, where the website's outlook page reads it. Only a valid PIN pass can unlock it.
on:
  schedule: [{ cron: '7,37 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: outlook-snap, cancel-in-progress: false }
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the locked copies (outlook, cyclones, cyclones world view)
        run: |
          mkdir out
          for k in outlook cyclones world; do
            f=$k; [ $k = world ] && f=cyclones-world
            curl -sSL --max-time 280 "https://script.google.com/macros/s/AKfycbxjvWtvkVhXZ7WifFCvoHFZ-LMRcTUjTEJ09AHTL4Ic89OznJwVNIHzkPXh2lOXNv2j/exec?page=snapjson&kind=$k" -o "out/$f.json" || true
            python3 - "out/$f.json" <<'PY' || rm -f "out/$f.json"
          import json, sys, os
          p = sys.argv[1]
          d = json.load(open(p))
          if d.get('v') not in (1, 2) or len(d.get('ct', '')) < 10000:
              print('not saved:', p, str(d)[:300]); sys.exit(1)
          print('locked copy OK:', p, round(os.path.getsize(p) / 1024), 'KB, key', d['kid'])
          PY
          done
          # the outlook's other days, each its own locked file
          curl -sSL --max-time 280 "https://script.google.com/macros/s/AKfycbxjvWtvkVhXZ7WifFCvoHFZ-LMRcTUjTEJ09AHTL4Ic89OznJwVNIHzkPXh2lOXNv2j/exec?page=snapjson&kind=days" -o days.json || true
          python3 - <<'PY' || true
          import json, os
          d = json.load(open('days.json'))
          os.makedirs('out/days', exist_ok=True)
          for k, v in (d.get('days') or {}).items():
              open('out/days/' + k + '.json', 'w').write(v)
          print('days:', ', '.join(sorted(d.get('days') or {})) or 'none', str(d)[:200] if not d.get('days') else '')
          PY
          ls -R out | head -30
      - name: Save them to the pages-outlook branch (one commit, no history)
        run: |
          cd out
          git init -q -b pages-outlook && git add -A .
          git -c user.name='wwxw-bot' -c user.email='actions@users.noreply.github.com' commit -qm "outlook and cyclone pages $(TZ=Australia/Perth date '+%-d %b %H:%M')"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pages-outlook
