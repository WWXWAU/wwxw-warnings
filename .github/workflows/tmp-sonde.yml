name: tmp sonde
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e +o pipefail
          for id in 94610 94802 94637 94638 94403 94302 94312 94203 94212 94461 94430 94300 94646; do
            b=$(curl -sL -m 40 "https://weather.uwyo.edu/wsgi/sounding?datetime=2026-11-26%2023:00:00&id=$id&type=TEXT:LIST")
            echo "R $id $(printf '%s' "$b" | grep -oE 'Observations for Station[^<]*' | head -1) bytes=${#b}"
          done
          curl -sL -m 40 "https://weather.uwyo.edu/wsgi/sounding?datetime=2026-11-26%2023:00:00&id=94610&type=TEXT:LIST" > p.html
          head -c 3000 p.html | sed 's/^/H /'
          echo; grep -n "PRES\|Station information\|Convective\|Precipitable\|Station latitude\|Station longitude\|Station elevation\|Observation time" p.html | head -20 | sed 's/^/K /'
          awk 'NR>=1' p.html | grep -nE '^\s+[0-9]{3,4}\.[0-9]' | sed -n '1,8p;400,404p' | sed 's/^/D /'
