<style>
#freeBtn { margin-left: auto; align-self: center; font: 600 14px var(--font); color: var(--on-accent); background: var(--accent); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
#freeBtn:focus-visible, #freeApp button:focus-visible, #freeApp select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#freeApp { display: none; max-width: 1240px; margin: 0 auto; gap: 16px; }
body.free #freeApp { display: grid; grid-template-columns: 300px 1fr; }
body.free .bench { display: none; }
@media (max-width: 860px) { body.free #freeApp { grid-template-columns: 1fr; } }
#freeApp .tools { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 12px; align-self: start; }
#freeApp .tools h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
#freeApp .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#freeApp button.t, #freeApp select, #freeApp label.t { font: 500 13px var(--font); color: var(--text); background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
#freeApp button.t:hover { border-color: var(--accent); }
#freeApp button.t[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
#freeApp button.go { background: var(--accent); color: var(--on-accent); border: 0; font-weight: 700; }
#freeApp button.bad { color: #b3261e; }
#freeApp input[type=color] { width: 38px; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--surface); cursor: pointer; }
#freeApp input[type=range] { flex: 1; min-width: 100px; accent-color: var(--accent); }
#freeApp .stage { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
#freeApp .wrap { display: flex; justify-content: center; background: repeating-conic-gradient(var(--sunk) 0 25%, transparent 0 50%) 0 0 / 20px 20px; border-radius: 8px; padding: 10px; }
#freeApp .hint { font-size: 12.5px; color: var(--muted); margin: 8px 2px 0; }
#freeApp .out { margin-top: 12px; }
#freeApp .out img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; }
#freeApp .small { font-size: 12px; color: var(--muted); }
</style>

<section id="freeApp" aria-label="Free design">
  <div class="tools">
    <div>
      <h3>Size</h3>
      <div class="row">
        <select id="fSize" aria-label="Image size">
          <option value="1080x1080">Square post 1080 × 1080</option>
          <option value="1080x1350">Tall post 1080 × 1350</option>
          <option value="1080x1920">Story 1080 × 1920</option>
          <option value="1600x900">Wide (X) 1600 × 900</option>
          <option value="1200x630">Link / Facebook 1200 × 630</option>
        </select>
        <input type="color" id="fBg" value="#0e2a33" title="Background colour" aria-label="Background colour">
      </div>
    </div>
    <div>
      <h3>Add</h3>
      <div class="row">
        <label class="t" for="fFile">Image…</label><input type="file" id="fFile" accept="image/*" multiple hidden>
        <button class="t" type="button" data-add="text">Text</button>
        <button class="t" type="button" data-add="rect">Box</button>
        <button class="t" type="button" data-add="circle">Circle</button>
        <button class="t" type="button" data-add="arrow">Arrow</button>
        <button class="t" type="button" data-add="line">Line</button>
      </div>
      <p class="small">Or drop images on the canvas, or paste one (Ctrl+V).</p>
      <div class="row">
        <button class="t" type="button" id="fLogo" aria-pressed="false">Logo</button>
        <button class="t" type="button" id="fFoot" aria-pressed="false">Footer</button>
      </div>
    </div>
    <div>
      <h3>Selected item</h3>
      <div class="row">
        <input type="color" id="fCol" value="#ffffff" title="Colour" aria-label="Colour">
        <select id="fFont" aria-label="Text size"><option>24</option><option>32</option><option>40</option><option selected>56</option><option>72</option><option>96</option><option>128</option></select>
        <button class="t" type="button" id="fBold" aria-pressed="true">Bold</button>
        <button class="t" type="button" id="fBox" aria-pressed="false" title="Dark box behind the text">Text box</button>
      </div>
      <div class="row" style="margin-top:8px"><span class="small">Opacity</span><input type="range" id="fOp" min="10" max="100" value="100" aria-label="Opacity"></div>
      <div class="row" style="margin-top:8px">
        <button class="t" type="button" id="fUp">Forward</button>
        <button class="t" type="button" id="fDown">Back</button>
        <button class="t" type="button" id="fDup">Copy</button>
        <button class="t bad" type="button" id="fDel">Delete</button>
      </div>
    </div>
    <div class="row">
      <button class="t go" type="button" id="fMake">Make PNG</button>
      <button class="t bad" type="button" id="fClear">Start again</button>
    </div>
  </div>
  <div class="stage">
    <div class="wrap" id="fWrap"><canvas id="fCanvas"></canvas></div>
    <p class="hint">Drag to move, corners to resize, the top handle to rotate. Double-click text to edit. Delete removes, arrow keys nudge, Ctrl+D copies. Your work is kept in this browser.</p>
    <div class="out" id="fOut"></div>
  </div>
</section>

    (function next(i) {
      var s = document.createElement('script'); s.src = urls[i];
      s.onload = cb; s.onerror = function () { if (i + 1 < urls.length) next(i + 1); else $('fOut').textContent = 'The drawing tool could not load. Check the internet connection and try again.'; };
      document.head.appendChild(s);
    })(0);
  }

  function fit() {   // the canvas keeps its real size (for the PNG) and is shown scaled to the space
    var box = $('fWrap').clientWidth - 20, k = Math.min(1, box / W, (window.innerHeight * 0.78) / H);
    fc.setDimensions({ width: Math.round(W * k) + 'px', height: Math.round(H * k) + 'px' }, { cssOnly: true });
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ W: W, H: H, bg: fc.backgroundColor, json: fc.toJSON(['wwKind']) })); } catch (e) {} }

  function start() {
    fabric.Object.prototype.set({ cornerColor: '#3FC1C9', cornerStrokeColor: '#0E2A33', borderColor: '#3FC1C9', cornerStyle: 'circle', transparentCorners: false, cornerSize: 18 });
    fc = new fabric.Canvas('fCanvas', { width: W, height: H, backgroundColor: '#0e2a33', preserveObjectStacking: true });
    var saved = null; try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    if (saved && saved.json) {
      W = saved.W; H = saved.H; $('fSize').value = W + 'x' + H; fc.setWidth(W); fc.setHeight(H);
      fc.loadFromJSON(saved.json, function () { fc.renderAll(); syncToggles(); fit(); });
      $('fBg').value = saved.bg || '#0e2a33';
    } else { fit(); }
    window.addEventListener('resize', fit);
    fc.on('object:modified', save); fc.on('object:added', save); fc.on('object:removed', save); fc.on('text:changed', save);
    fc.on('selection:created', pick); fc.on('selection:updated', pick);
    wire();
  }
  function centre(o) { fc.add(o); o.set({ left: (W - o.getScaledWidth()) / 2, top: (H - o.getScaledHeight()) / 2 }); o.setCoords(); fc.setActiveObject(o); fc.requestRenderAll(); save(); }
  function addImageURL(url) {
    fabric.Image.fromURL(url, function (img) {
      var k = Math.min(1, (W * 0.8) / img.width, (H * 0.8) / img.height); img.scale(k); centre(img);
    });
  }
  function takeFiles(files) {
    [].forEach.call(files || [], function (f) {
      if (!/^image\//.test(f.type)) return;
      var r = new FileReader(); r.onload = function () { addImageURL(r.result); }; r.readAsDataURL(f);
    });
  }
  function col() { return $('fCol').value; }
  function add(kind) {
    var o;
    if (kind === 'text') o = new fabric.Textbox('Your text', { width: W * 0.6, fontSize: +$('fFont').value, fontFamily: FONT, fontWeight: 700, fill: col(), textAlign: 'center' });
    else if (kind === 'rect') o = new fabric.Rect({ width: W * 0.3, height: H * 0.15, rx: 16, ry: 16, fill: 'rgba(0,0,0,0)', stroke: col(), strokeWidth: 8 });
    else if (kind === 'circle') o = new fabric.Circle({ radius: Math.min(W, H) * 0.12, fill: 'rgba(0,0,0,0)', stroke: col(), strokeWidth: 8 });
    else if (kind === 'arrow') o = new fabric.Path('M 0 30 L 220 30 M 180 0 L 222 30 L 180 60', { fill: '', stroke: col(), strokeWidth: 12, strokeLineCap: 'round', strokeLineJoin: 'round' });
    else if (kind === 'line') o = new fabric.Line([0, 0, 300, 0], { stroke: col(), strokeWidth: 8, strokeLineCap: 'round' });
    if (o) centre(o);
  }
  function find(kind) { return fc.getObjects().filter(function (o) { return o.wwKind === kind; })[0]; }
  function placeLogo(o) { var k = (W * 0.32) / o.width; o.set({ scaleX: k, scaleY: k, left: W * 0.04, top: W * 0.04 }); o.setCoords(); }
  function footer() {
    var h = Math.round(Math.max(W, H) * 0.045), t = new fabric.Text('Unofficial · westweatherwatchers.com', { fontFamily: FONT, fontSize: Math.round(h * 0.45), fontWeight: 500, fill: '#e2eef0', originX: 'center', originY: 'center', left: W / 2, top: h / 2 });
    var r = new fabric.Rect({ left: 0, top: 0, width: W, height: h, fill: 'rgba(8,24,29,0.85)' });
    var g = new fabric.Group([r, t], { left: 0, top: H - h, wwKind: 'footer', lockMovementX: true });
    return g;
  }
  function syncToggles() { $('fLogo').setAttribute('aria-pressed', !!find('logo')); $('fFoot').setAttribute('aria-pressed', !!find('footer')); }
  function pick() {
    var o = fc.getActiveObject(); if (!o) return;
    $('fOp').value = Math.round((o.opacity == null ? 1 : o.opacity) * 100);
    if (o.type === 'textbox') { $('fFont').value = String(o.fontSize); $('fBold').setAttribute('aria-pressed', o.fontWeight >= 600); $('fBox').setAttribute('aria-pressed', !!o.backgroundColor); }
  }
  function sel(fn) { var o = fc.getActiveObject(); if (!o) return; fn(o); fc.requestRenderAll(); save(); }

  function wire() {
    $('fFile').addEventListener('change', function () { takeFiles(this.files); this.value = ''; });
    document.querySelectorAll('#freeApp [data-add]').forEach(function (b) { b.addEventListener('click', function () { add(b.getAttribute('data-add')); }); });
    var wrap = $('fWrap');
    wrap.addEventListener('dragover', function (e) { e.preventDefault(); });
    wrap.addEventListener('drop', function (e) { e.preventDefault(); takeFiles(e.dataTransfer.files); });
    document.addEventListener('paste', function (e) {
      if (!document.body.classList.contains('free')) return;
      var it = [].filter.call((e.clipboardData || {}).items || [], function (i) { return /^image\//.test(i.type); });
      if (it.length) { e.preventDefault(); takeFiles(it.map(function (i) { return i.getAsFile(); })); }
    });
    $('fSize').addEventListener('change', function () {
      var p = this.value.split('x'); W = +p[0]; H = +p[1]; fc.setWidth(W); fc.setHeight(H);
      var f = find('footer'); if (f) { fc.remove(f); fc.add(footer()); }
      var l = find('logo'); if (l) placeLogo(l);
      fit(); fc.requestRenderAll(); save();
    });
    $('fBg').addEventListener('input', function () { fc.setBackgroundColor(this.value, function () { fc.requestRenderAll(); save(); }); });
    $('fLogo').addEventListener('click', function () {
      var l = find('logo'); if (l) { fc.remove(l); syncToggles(); return; }
      fabric.Image.fromURL(LOGO, function (img) { img.wwKind = 'logo'; placeLogo(img); fc.add(img); syncToggles(); save(); });
    });
    $('fFoot').addEventListener('click', function () { var f = find('footer'); if (f) fc.remove(f); else fc.add(footer()); syncToggles(); });
    $('fCol').addEventListener('input', function () {
      var c = this.value;
      sel(function (o) { if (o.type === 'textbox' || o.type === 'text') o.set('fill', c); else if (o.type !== 'image' && o.type !== 'group') o.set('stroke', c); });
    });
    $('fFont').addEventListener('change', function () { var v = +this.value; sel(function (o) { if (o.type === 'textbox') o.set('fontSize', v); }); });
    $('fBold').addEventListener('click', function () { var on = this.getAttribute('aria-pressed') !== 'true'; this.setAttribute('aria-pressed', on); sel(function (o) { if (o.type === 'textbox') o.set('fontWeight', on ? 700 : 400); }); });
    $('fBox').addEventListener('click', function () { var on = this.getAttribute('aria-pressed') !== 'true'; this.setAttribute('aria-pressed', on); sel(function (o) { if (o.type === 'textbox') o.set({ backgroundColor: on ? 'rgba(8,24,29,0.75)' : '', padding: on ? 14 : 0 }); }); });
    $('fOp').addEventListener('input', function () { var v = this.value / 100; sel(function (o) { o.set('opacity', v); }); });
    $('fUp').addEventListener('click', function () { sel(function (o) { fc.bringForward(o); }); });
    $('fDown').addEventListener('click', function () { sel(function (o) { fc.sendBackwards(o); }); });
    $('fDup').addEventListener('click', dup);
    $('fDel').addEventListener('click', del);
    $('fClear').addEventListener('click', function () { if (!confirmClear()) return; fc.clear(); fc.setBackgroundColor($('fBg').value, function () { fc.requestRenderAll(); }); syncToggles(); save(); $('fOut').innerHTML = ''; });
    $('fMake').addEventListener('click', make);
    document.addEventListener('keydown', function (e) {
      if (!document.body.classList.contains('free') || !fc) return;
      var o = fc.getActiveObject(); if (!o || o.isEditing || /INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName)) return;
      if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); del(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') { e.preventDefault(); dup(); }
      else if (/^Arrow/.test(e.key)) { e.preventDefault(); var s = e.shiftKey ? 20 : 2; o.set({ left: o.left + (e.key === 'ArrowLeft' ? -s : e.key === 'ArrowRight' ? s : 0), top: o.top + (e.key === 'ArrowUp' ? -s : e.key === 'ArrowDown' ? s : 0) }); o.setCoords(); fc.requestRenderAll(); save(); }
    });
  }
  var clearArmed = 0;
  function confirmClear() {   // two clicks within 3 s (no pop-up dialogs)
    if (Date.now() - clearArmed < 3000) { clearArmed = 0; $('fClear').textContent = 'Start again'; return true; }
    clearArmed = Date.now(); $('fClear').textContent = 'Click again to clear'; setTimeout(function () { $('fClear').textContent = 'Start again'; }, 3000); return false;
  }
  function dup() { var o = fc.getActiveObject(); if (!o) return; o.clone(function (c) { c.set({ left: o.left + 30, top: o.top + 30, wwKind: o.wwKind === 'footer' || o.wwKind === 'logo' ? undefined : o.wwKind }); fc.add(c); fc.setActiveObject(c); fc.requestRenderAll(); }, ['wwKind']); }
  function del() { var o = fc.getActiveObject(); if (!o) return; (o.type === 'activeSelection' ? o.getObjects() : [o]).forEach(function (x) { fc.remove(x); }); fc.discardActiveObject(); fc.requestRenderAll(); syncToggles(); }
  function make() {
    fc.discardActiveObject(); fc.renderAll();
    var url = fc.toDataURL({ format: 'png', multiplier: 1 }), out = $('fOut');
    out.innerHTML = '<p class="small">Right-click (or long-press) the image and choose Save image. Or <a download="wwxw-' + W + 'x' + H + '.png" href="' + url + '">download it</a>.</p><img alt="Your image, ' + W + ' by ' + H + '" src="' + url + '">';
    out.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
})();
</script>
</body></html>
